<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex_Row_Layer</title>
     <style>

		.container {
    			display: flex;
    			flex-direction: row;
    			gap: 20px;
    			justify-content: center;
		}

		.box {
    			width: 700px;
    			height: 400px;
    			border: 2px solid black;
		}

		.box img {
    			width: 700px;
    			height: 400px;
    			object-fit: cover;
		}

		</style>
	</head>

	<body>
		<h2>Brooklyn Bridge - Flex Row Layout</h2>
    <div class="container">
      <div class="box"><img src="brooklynbridge.jpg" alt="Brooklynbridge"</div>
      <div class="box"><img src="brooklynbridge.jpg" alt="Brooklynbridge"</div>
      <div class="box"><img src="brooklynbridge.jpg" alt="Brooklynbridge"</div>
      <div class="box"><img src="brooklynbridge.jpg" alt="Brooklynbridge"</div>
      <div class="box"><img src="brooklynbridge.jpg" alt="Brooklynbridge"</div>
      
    </div>

	</body>
</html>
